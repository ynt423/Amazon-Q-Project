<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCP & RS Fusion: The Next-Gen Growth Stock Screener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .signal-card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .score-display {
            font-size: 3rem;
            font-weight: bold;
        }
        .pattern-badge {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
        }
        .loading {
            display: none;
        }
        .chart-container {
            height: 500px;
            margin: 20px 0;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- 標題區域 -->
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">🚀 VCP & RS Fusion</h1>
            <p class="lead text-muted">The Next-Gen Growth Stock Screener</p>
            <p class="text-secondary">基於 William O'Neil 和 Mark Minervini 成長股分析哲學</p>
        </div>

        <!-- 輸入區域 -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <div class="card signal-card">
                    <div class="card-body p-4">
                        <h5 class="card-title text-center mb-3">股票分析</h5>
                        <div class="input-group mb-3">
                            <input type="text" id="tickerInput" class="form-control form-control-lg" 
                                   placeholder="輸入股票代號 (例如: TSLA, AAPL)" maxlength="10">
                            <button class="btn btn-primary btn-lg" type="button" id="analyzeBtn">
                                <span class="analyze-text">生成信號</span>
                                <span class="loading spinner-border spinner-border-sm" role="status"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 結果區域 -->
        <div id="resultsSection" style="display: none;">
            <!-- 信號卡片 -->
            <div class="row justify-content-center mb-4">
                <div class="col-md-8">
                    <div class="card signal-card">
                        <div class="card-body text-center p-4">
                            <h5 class="card-title mb-3">綜合信號評分</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div id="scoreDisplay" class="score-display text-primary">--</div>
                                    <p class="text-muted">信號強度 (0-100)</p>
                                </div>
                                <div class="col-md-6">
                                    <span id="adviceBadge" class="badge fs-4 pattern-badge">--</span>
                                    <p class="text-muted mt-2">操作建議</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分析詳情 -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card signal-card h-100">
                        <div class="card-body">
                            <h5 class="card-title">📊 技術指標</h5>
                            <div class="row">
                                <div class="col-6">
                                    <div class="text-center p-3">
                                        <div class="h4 text-info" id="rsRating">--</div>
                                        <small class="text-muted">RS Rating</small>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="text-center p-3">
                                        <div class="h4 text-warning" id="rsiValue">--</div>
                                        <small class="text-muted">RSI</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card signal-card h-100">
                        <div class="card-body">
                            <h5 class="card-title">🎯 形態識別</h5>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>VCP 形態:</span>
                                    <span id="vcpStatus" class="badge bg-secondary">--</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>Cup & Handle:</span>
                                    <span id="cupHandleStatus" class="badge bg-secondary">--</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 價格圖表 -->
            <div class="row">
                <div class="col-12">
                    <div class="card signal-card">
                        <div class="card-body">
                            <h5 class="card-title">📈 價格走勢圖</h5>
                            <div id="priceChart" class="chart-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 錯誤提示 -->
        <div id="errorAlert" class="alert alert-danger" style="display: none;" role="alert">
            <strong>錯誤!</strong> <span id="errorMessage"></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class StockAnalyzer {
            constructor() {
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                const analyzeBtn = document.getElementById('analyzeBtn');
                const tickerInput = document.getElementById('tickerInput');

                analyzeBtn.addEventListener('click', () => this.analyzeStock());
                tickerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.analyzeStock();
                    }
                });
            }

            async analyzeStock() {
                const ticker = document.getElementById('tickerInput').value.trim();
                
                if (!ticker) {
                    this.showError('請輸入股票代號');
                    return;
                }

                this.setLoading(true);
                this.hideError();
                this.hideResults();

                try {
                    const response = await fetch('/signal/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ ticker: ticker })
                    });

                    const data = await response.json();

                    if (data.success) {
                        this.displayResults(data);
                    } else {
                        this.showError(data.error || '分析失敗');
                    }
                } catch (error) {
                    this.showError('網絡錯誤，請稍後再試');
                } finally {
                    this.setLoading(false);
                }
            }

            displayResults(data) {
                // 更新信號評分
                document.getElementById('scoreDisplay').textContent = data.final_score;
                
                const adviceBadge = document.getElementById('adviceBadge');
                adviceBadge.textContent = data.advice;
                adviceBadge.className = `badge fs-4 pattern-badge bg-${data.advice_color}`;

                // 更新技術指標
                document.getElementById('rsRating').textContent = data.rs_rating;
                document.getElementById('rsiValue').textContent = data.rsi;

                // 更新形態識別
                const vcpStatus = document.getElementById('vcpStatus');
                vcpStatus.textContent = data.vcp_status;
                vcpStatus.className = `badge ${data.vcp_detected ? 'bg-success' : 'bg-secondary'}`;

                const cupHandleStatus = document.getElementById('cupHandleStatus');
                cupHandleStatus.textContent = data.cup_handle_status;
                cupHandleStatus.className = `badge ${data.cup_handle_detected ? 'bg-success' : 'bg-secondary'}`;

                // 繪製圖表
                this.drawChart(data.chart_data, data.ticker);

                // 顯示結果
                this.showResults();
            }

            drawChart(chartData, ticker) {
                if (!chartData || !chartData.dates) {
                    return;
                }

                const candlestickTrace = {
                    x: chartData.dates,
                    open: chartData.open,
                    high: chartData.high,
                    low: chartData.low,
                    close: chartData.close,
                    type: 'candlestick',
                    name: ticker,
                    increasing: { line: { color: '#00ff00' } },
                    decreasing: { line: { color: '#ff0000' } }
                };

                const ma20Trace = {
                    x: chartData.dates,
                    y: chartData.ma20,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'MA20',
                    line: { color: '#1f77b4', width: 2 }
                };

                const layout = {
                    title: `${ticker} 股價走勢 (最近6個月)`,
                    xaxis: { title: '日期' },
                    yaxis: { title: '價格 ($)' },
                    showlegend: true,
                    height: 450
                };

                Plotly.newPlot('priceChart', [candlestickTrace, ma20Trace], layout);
            }

            setLoading(isLoading) {
                const analyzeText = document.querySelector('.analyze-text');
                const loadingSpinner = document.querySelector('.loading');
                const analyzeBtn = document.getElementById('analyzeBtn');

                if (isLoading) {
                    analyzeText.style.display = 'none';
                    loadingSpinner.style.display = 'inline-block';
                    analyzeBtn.disabled = true;
                } else {
                    analyzeText.style.display = 'inline';
                    loadingSpinner.style.display = 'none';
                    analyzeBtn.disabled = false;
                }
            }

            showResults() {
                document.getElementById('resultsSection').style.display = 'block';
            }

            hideResults() {
                document.getElementById('resultsSection').style.display = 'none';
            }

            showError(message) {
                document.getElementById('errorMessage').textContent = message;
                document.getElementById('errorAlert').style.display = 'block';
            }

            hideError() {
                document.getElementById('errorAlert').style.display = 'none';
            }
        }

        // 初始化應用
        document.addEventListener('DOMContentLoaded', () => {
            new StockAnalyzer();
        });
    </script>
</body>
</html>
